syntax = "proto3";

package obraclara.ai.v1;

option java_multiple_files = true;
option java_package = "com.obraclara.ai.v1";
option java_outer_classname = "DocumentAiProto";

service DocumentAiService {
  rpc ProcessDocument(ProcessDocumentRequest) returns (ProcessDocumentResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
}

message ProcessDocumentRequest {
  string organization_id = 1;
  string project_id = 2;
  string document_id = 3;
  string file_name = 4;
  bytes content = 5;
  string idempotency_key = 6;
}

message ProcessDocumentResponse {
  string document_type = 1;
  repeated Page pages = 2;
  repeated ExtractedField fields = 3;
  repeated Evidence evidences = 4;
  repeated PiiFinding pii_findings = 5;
}

message Page {
  int32 number = 1;
  string text = 2;
}

message ExtractedField {
  string name = 1;
  string raw_value = 2;
  string normalized_value = 3;
  double confidence = 4;
  int32 page = 5;
  string quote = 6;
}

message Evidence {
  string evidence_id = 1;
  int32 page = 2;
  string quote = 3;
  repeated double bounding_box = 4;
}

message PiiFinding {
  string type = 1;
  int32 page = 2;
  string masked_value = 3;
}

message HealthRequest {}

message HealthResponse {
  string status = 1;
  string mode = 2;
}
