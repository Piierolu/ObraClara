[build-system]
requires = ["setuptools>=80,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "obraclara-ai-service"
version = "0.1.0"
description = "Deterministic document AI service for the ObraClara MVP"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.116,<0.117",
  "grpcio>=1.74,<1.75",
  "grpcio-tools>=1.74,<1.75",
  "pydantic>=2.11,<3",
  "pypdf>=5.8,<6",
  "uvicorn[standard]>=0.35,<0.36",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<0.29",
  "pytest>=8.4,<9",
]

[tool.setuptools.packages.find]
include = ["obra_ai*"]

[tool.setuptools.package-data]
obra_ai = ["schema/*.proto", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
