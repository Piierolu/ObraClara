name: obraclara

services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_DB: obraclara
      POSTGRES_USER: obraclara
      POSTGRES_PASSWORD: obraclara
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obraclara -d obraclara"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: obraclara
      MINIO_ROOT_PASSWORD: obraclara-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  temporal:
    image: temporalio/auto-setup:1.27.2
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: obraclara
      POSTGRES_PWD: obraclara
      POSTGRES_SEEDS: postgres
    ports:
      - "7233:7233"
    depends_on:
      postgres:
        condition: service_healthy

  temporal-ui:
    image: temporalio/ui:2.34.0
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8088:8080"
    depends_on:
      - temporal

  ai-service:
    build:
      context: ./apps/ai-service
    environment:
      AI_MODE: MOCK
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 8000
      GRPC_HOST: 0.0.0.0
      GRPC_PORT: 50051
    ports:
      - "8000:8000"
      - "50051:50051"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  jaeger:
    image: jaegertracing/all-in-one:1.64.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/otel/collector.yml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - jaeger

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/obraclara
      DATABASE_USERNAME: obraclara
      DATABASE_PASSWORD: obraclara
      STORAGE_TYPE: minio
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: obraclara
      MINIO_SECRET_KEY: obraclara-secret
      MINIO_BUCKET: obraclara-documents
      AI_GRPC_ADDRESS: ai-service:50051
      TEMPORAL_ENABLED: "true"
      TEMPORAL_TARGET: temporal:7233
      TEMPORAL_TASK_QUEUE: document-processing
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "8080:8080"
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      ai-service:
        condition: service_healthy
      temporal:
        condition: service_started
      otel-collector:
        condition: service_started

  web:
    build:
      context: ./apps/web
      args:
        VITE_API_URL: /api
        VITE_DEMO_MODE: "false"
    ports:
      - "3000:80"
    depends_on:
      - backend

  opensearch:
    image: opensearchproject/opensearch:2.19.1
    profiles: ["search"]
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data

volumes:
  postgres-data:
  minio-data:
  opensearch-data:
